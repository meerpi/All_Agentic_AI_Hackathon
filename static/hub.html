<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskmaster — Agent Testing Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0e13;
            --surface: #15181f;
            --surface-2: #1c2029;
            --border: rgba(255,255,255,0.07);
            --text: #e4e7ec;
            --text-dim: #7a8194;
            --accent: #6366f1;
            --accent-glow: rgba(99,102,241,0.15);
            --green: #22c55e;
            --red: #ef4444;
            --amber: #f59e0b;
            --blue: #3b82f6;
            --radius: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ─── Header ─── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: rgba(12,14,19,0.9);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 50;
        }
        .header-left { display: flex; align-items: center; gap: 0.6rem; }
        .header-left h1 { font-size: 1rem; font-weight: 700; letter-spacing: -0.3px; }
        .header-left .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
        .header-right { display: flex; gap: 0.5rem; align-items: center; }
        .chip {
            font-size: 0.7rem; font-weight: 500;
            padding: 0.25rem 0.6rem; border-radius: 20px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--border);
            color: var(--text-dim);
        }
        .chip.live { color: var(--green); border-color: rgba(34,197,94,0.3); }

        /* ─── Layout ─── */
        .app { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 300px; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        @media (max-width: 800px) {
            .app { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
        }

        /* ─── Sidebar ─── */
        .sidebar-section { padding: 1rem; border-bottom: 1px solid var(--border); }
        .sidebar-section h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 0.6rem; font-weight: 600; }
        .quick-btn {
            width: 100%; text-align: left; padding: 0.55rem 0.7rem;
            background: transparent; border: 1px solid transparent;
            border-radius: 6px; color: var(--text); font-size: 0.82rem;
            cursor: pointer; transition: all 0.15s; line-height: 1.3;
            font-family: inherit; margin-bottom: 0.3rem;
        }
        .quick-btn:hover { background: var(--accent-glow); border-color: rgba(99,102,241,0.25); }
        .quick-btn .tag { font-size: 0.65rem; color: var(--accent); font-weight: 600; display: block; margin-bottom: 0.15rem; }

        /* tool list */
        .tools-list { max-height: 220px; overflow-y: auto; }
        .tool-item {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.3rem 0; font-size: 0.78rem;
        }
        .tool-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
        .tool-name { font-family: 'JetBrains Mono', monospace; color: var(--blue); font-size: 0.72rem; }

        /* ─── Main Area ─── */
        .input-bar {
            display: flex; gap: 0.5rem; padding: 1rem; border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .input-bar textarea {
            flex: 1; resize: none; border: 1px solid var(--border); border-radius: var(--radius);
            background: var(--bg); color: var(--text); padding: 0.7rem 0.85rem;
            font-size: 0.9rem; font-family: inherit; outline: none; min-height: 56px;
            transition: border-color 0.2s;
        }
        .input-bar textarea:focus { border-color: var(--accent); }
        .input-bar textarea::placeholder { color: var(--text-dim); }
        .run-btn {
            padding: 0 1.2rem; border: none; border-radius: var(--radius);
            background: var(--accent); color: white; font-weight: 600;
            font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
            font-family: inherit; white-space: nowrap;
        }
        .run-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .run-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ─── Results ─── */
        .results-area { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }

        .status-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.6rem 0.8rem; border-radius: var(--radius);
            background: var(--surface); border: 1px solid var(--border);
            font-size: 0.82rem;
        }
        .status-bar .label { color: var(--text-dim); }
        .status-bar .value { font-weight: 600; }
        .status-bar .value.ok { color: var(--green); }
        .status-bar .value.fail { color: var(--red); }
        .status-bar .value.running { color: var(--amber); }

        /* DAG */
        .dag-container {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow-x: auto; padding: 1rem;
        }
        .dag-container .dag-title { font-size: 0.75rem; color: var(--text-dim); font-weight: 600; margin-bottom: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Step cards */
        .step-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 0.85rem 1rem;
            border-left: 3px solid var(--text-dim);
            transition: border-color 0.2s;
        }
        .step-card.completed { border-left-color: var(--green); }
        .step-card.failed { border-left-color: var(--red); }
        .step-card.in_progress { border-left-color: var(--amber); }
        .step-card.blocked { border-left-color: #64748b; }
        .step-card.waiting_approval { border-left-color: #a855f7; }

        .step-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
        .step-title { font-size: 0.85rem; font-weight: 600; }
        .step-tool {
            font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
            padding: 0.15rem 0.45rem; border-radius: 4px;
            background: rgba(99,102,241,0.12); color: var(--accent); border: 1px solid rgba(99,102,241,0.2);
        }
        .step-reasoning { font-size: 0.78rem; color: var(--text-dim); line-height: 1.4; margin-top: 0.2rem; }
        .step-meta { font-size: 0.7rem; color: var(--text-dim); margin-top: 0.35rem; display: flex; gap: 1rem; }
        .step-meta .deps { color: #94a3b8; }
        .step-meta .time { color: var(--green); }
        .step-link {
            display: inline-flex; align-items: center; gap: 0.3rem;
            margin-top: 0.4rem; padding: 0.3rem 0.6rem;
            background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.25);
            border-radius: 6px; color: var(--blue); text-decoration: none;
            font-size: 0.75rem; font-weight: 500;
        }
        .step-link:hover { background: rgba(59,130,246,0.2); }

        /* Summary */
        .summary-box {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1rem;
            font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap;
            color: #cbd5e1; max-height: 300px; overflow-y: auto;
        }
        .summary-box h4 { color: var(--text); font-size: 0.8rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Trace Console */
        .trace-console {
            background: #07090d; border: 1px solid var(--border);
            border-radius: var(--radius); padding: 0.75rem;
            font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
            color: #a7f3d0; max-height: 200px; overflow-y: auto;
        }
        .trace-line { display: flex; gap: 0.5rem; line-height: 1.5; }
        .trace-time { color: #475569; }
        .trace-event { color: var(--blue); font-weight: 600; }

        /* Empty state */
        .empty-state {
            text-align: center; padding: 3rem 1rem; color: var(--text-dim); font-size: 0.9rem;
        }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.3; }

        /* Loading spinner */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            width: 20px; height: 20px; border: 2px solid var(--border);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.6s linear infinite; display: inline-block;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <div class="dot"></div>
            <h1>Taskmaster Agent Hub</h1>
        </div>
        <div class="header-right">
            <span class="chip live" id="healthChip">● Checking...</span>
            <span class="chip" id="toolCountChip">— tools</span>
            <a href="/docs" target="_blank" class="chip" style="text-decoration:none; color:var(--accent);">API Docs ↗</a>
        </div>
    </div>

    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>Quick Tests</h3>
                <button class="quick-btn" onclick="setGoal('Go to https://www.youtube.com/watch?v=wZa7yNAXHK4 and tell me who is this video about and at what timestamp is his mentor first mentioned')">
                    <span class="tag">🎬 YouTube Video Analysis</span>
                    Watch a YouTube video and answer questions about it
                </button>
                <button class="quick-btn" onclick="setGoal('Search YouTube for Lex Fridman Yann LeCun podcast, play the first result for 30 seconds, then close the browser')">
                    <span class="tag">▶️ YouTube Search & Play</span>
                    Search, play with ad-skip, close after 30s
                </button>
                <button class="quick-btn" onclick="setGoal('Navigate to news.ycombinator.com, extract the top 5 headlines, and return them as a list')">
                    <span class="tag">🌐 Web Scraping</span>
                    Browse HN and extract headlines
                </button>
                <button class="quick-btn" onclick="setGoal('Read my latest 3 Gmail emails and summarize who they are from and what they are about')">
                    <span class="tag">📧 Gmail</span>
                    Read inbox and summarize recent emails
                </button>
                <button class="quick-btn" onclick="setGoal('Create a Google Doc titled \"Weekly Status Report\" with a summary of 3 key achievements this week and next week goals')">
                    <span class="tag">📄 Google Docs</span>
                    Create a document with content
                </button>
                <button class="quick-btn" onclick="setGoal('Check my Google Calendar for upcoming events this week and list them')">
                    <span class="tag">📅 Calendar</span>
                    List upcoming events
                </button>
                <button class="quick-btn" onclick="setGoal('Create a Google Sheet called \"Q3 Sales Tracker\" with columns: Date, Client, Amount, Status. Add 3 sample rows.')">
                    <span class="tag">📊 Sheets</span>
                    Create spreadsheet with data
                </button>
                <button class="quick-btn" onclick="setGoal('Send a Slack message to #general saying: Team standup moved to 3pm today')">
                    <span class="tag">💬 Slack</span>
                    Post a message to a channel
                </button>
            </div>

            <div class="sidebar-section" style="flex: 1; overflow: hidden;">
                <h3>Registered Tools (<span id="toolCount">0</span>)</h3>
                <div class="tools-list" id="toolsList"></div>
            </div>
        </aside>

        <!-- Main -->
        <div class="main">
            <div class="input-bar">
                <textarea id="goalInput" rows="2" placeholder="Type an instruction for the agent to execute..."></textarea>
                <button class="run-btn" id="runBtn" onclick="runAgent()">▶ Run</button>
            </div>

            <div class="results-area" id="resultsArea">
                <div class="empty-state" id="emptyState">
                    <div class="icon">⚡</div>
                    <div>Type an instruction or pick a quick test from the sidebar.<br>
                    <span style="font-size:0.8rem; color: #475569;">The agent will use the LLM to plan which tools to call, then execute them.</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ─── Health Check ───
        async function checkHealth() {
            try {
                const res = await fetch('/api/health');
                const d = await res.json();
                document.getElementById('healthChip').textContent = '● ' + d.status;
                document.getElementById('healthChip').className = 'chip live';
            } catch {
                document.getElementById('healthChip').textContent = '● OFFLINE';
                document.getElementById('healthChip').style.color = '#ef4444';
            }
        }

        // ─── Load Tools ───
        async function loadTools() {
            try {
                const res = await fetch('/api/agent/tools');
                const d = await res.json();
                const list = document.getElementById('toolsList');
                const count = document.getElementById('toolCount');
                const chip = document.getElementById('toolCountChip');
                count.textContent = d.tools.length;
                chip.textContent = d.tools.length + ' tools';
                list.innerHTML = d.tools.map(t =>
                    `<div class="tool-item"><div class="tool-dot"></div><span class="tool-name">${t.name}</span></div>`
                ).join('');
            } catch (e) {
                console.error('Failed to load tools:', e);
            }
        }

        function setGoal(text) {
            document.getElementById('goalInput').value = text;
            document.getElementById('goalInput').focus();
        }

        // ─── Run Agent ───
        async function runAgent() {
            const goal = document.getElementById('goalInput').value.trim();
            if (!goal) return;

            const btn = document.getElementById('runBtn');
            const area = document.getElementById('resultsArea');
            const empty = document.getElementById('emptyState');

            btn.disabled = true;
            btn.textContent = '⏳ Running...';
            if (empty) empty.style.display = 'none';

            // Show loading state
            area.innerHTML = `
                <div class="status-bar">
                    <div><span class="label">Goal: </span><span style="color:var(--text);">${escHtml(goal.substring(0, 120))}${goal.length > 120 ? '...' : ''}</span></div>
                    <div class="value running"><div class="spinner" style="display:inline-block;vertical-align:middle;margin-right:4px;"></div> EXECUTING</div>
                </div>
            `;

            try {
                const startMs = Date.now();
                const response = await fetch('/api/agent/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ goal })
                });
                const wf = await response.json();
                const elapsedSec = ((Date.now() - startMs) / 1000).toFixed(1);

                if (wf.detail) {
                    // Error from server
                    area.innerHTML = `
                        <div class="status-bar">
                            <div><span class="label">Goal: </span>${escHtml(goal.substring(0, 80))}</div>
                            <div class="value fail">ERROR</div>
                        </div>
                        <div class="summary-box" style="border-left: 3px solid var(--red);"><h4>Error</h4>${escHtml(wf.detail)}</div>
                    `;
                    return;
                }

                renderResult(wf, goal, elapsedSec);
                fetchTraces(wf.workflow_id);

            } catch (err) {
                area.innerHTML = `
                    <div class="status-bar">
                        <div><span class="label">Goal: </span>${escHtml(goal.substring(0, 80))}</div>
                        <div class="value fail">NETWORK ERROR</div>
                    </div>
                    <div class="summary-box" style="border-left: 3px solid var(--red);"><h4>Error</h4>${escHtml(err.message)}</div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '▶ Run';
            }
        }

        function renderResult(wf, goal, elapsedSec) {
            const area = document.getElementById('resultsArea');
            const statusClass = wf.status === 'COMPLETED' ? 'ok' : wf.status === 'FAILED' ? 'fail' : 'running';

            let html = `
                <div class="status-bar">
                    <div><span class="label">Goal: </span><span style="color:var(--text);">${escHtml(goal.substring(0, 100))}</span></div>
                    <div style="display:flex;gap:1rem;align-items:center;">
                        <span class="label">${wf.steps ? wf.steps.length : 0} steps</span>
                        <span class="label">${elapsedSec}s</span>
                        <span class="value ${statusClass}">${wf.status}</span>
                    </div>
                </div>
            `;

            // DAG
            if (wf.steps && wf.steps.length > 0) {
                html += renderDAG(wf.steps);

                // Step cards
                wf.steps.forEach(step => {
                    const s = (step.status || 'PENDING').toLowerCase();
                    let linkHtml = '';
                    const res = step.result || {};
                    const url = res.url || res.link;
                    if (url && typeof url === 'string' && url.startsWith('http')) {
                        let label = 'Open';
                        if (url.includes('docs.google.com/document')) label = 'Open Google Doc';
                        else if (url.includes('docs.google.com/spreadsheets')) label = 'Open Google Sheet';
                        else if (url.includes('calendar.google.com')) label = 'Open Calendar Event';
                        else if (url.includes('youtube.com')) label = 'Open YouTube';
                        linkHtml = `<a class="step-link" href="${url}" target="_blank">↗ ${label}</a>`;
                    }

                    html += `
                        <div class="step-card ${s}">
                            <div class="step-top">
                                <span class="step-title">Step ${step.step_number}: ${escHtml(step.description || '')}</span>
                                <span class="step-tool">${step.tool_name}</span>
                            </div>
                            ${step.reasoning ? `<div class="step-reasoning">${escHtml(step.reasoning)}</div>` : ''}
                            <div class="step-meta">
                                ${step.depends_on && step.depends_on.length ? `<span class="deps">depends on: ${step.depends_on.join(', ')}</span>` : ''}
                                ${step.execution_time_ms ? `<span class="time">${Math.round(step.execution_time_ms)}ms</span>` : ''}
                                ${step.error ? `<span style="color:var(--red);">✗ ${escHtml(step.error.substring(0, 100))}</span>` : ''}
                            </div>
                            ${linkHtml}
                            ${res && Object.keys(res).length > 0 && !url ? `<details style="margin-top:0.4rem;"><summary style="font-size:0.72rem;color:var(--text-dim);cursor:pointer;">View raw result</summary><pre style="font-size:0.68rem;color:#94a3b8;margin-top:0.3rem;white-space:pre-wrap;max-height:150px;overflow:auto;">${escHtml(JSON.stringify(res, null, 2))}</pre></details>` : ''}
                        </div>
                    `;
                });
            }

            // Summary
            if (wf.summary) {
                html += `<div class="summary-box"><h4>Agent Summary</h4>${escHtml(wf.summary)}</div>`;
            }

            // Traces placeholder
            html += `<div class="trace-console" id="traceConsole"><div class="trace-line"><span class="trace-time">[loading]</span><span>Fetching execution traces...</span></div></div>`;

            area.innerHTML = html;
        }

        function renderDAG(steps) {
            const stepByNum = {};
            steps.forEach(s => { stepByNum[s.step_number] = s; });

            const levels = [];
            const assigned = new Set();
            let current = steps.filter(s => !s.depends_on || s.depends_on.length === 0).map(s => s.step_number);
            while (current.length > 0) {
                levels.push(current);
                current.forEach(n => assigned.add(n));
                const next = [];
                steps.forEach(s => {
                    if (!assigned.has(s.step_number) && s.depends_on && s.depends_on.every(d => assigned.has(d))) next.push(s.step_number);
                });
                current = next;
            }
            steps.forEach(s => { if (!assigned.has(s.step_number)) { if (!levels.length) levels.push([]); levels[levels.length - 1].push(s.step_number); }});

            const nw = 140, nh = 38, px = 30, py = 50, tp = 20;
            const maxW = Math.max(...levels.map(l => l.length), 1);
            const svgW = Math.max(maxW * (nw + px) + px, 350);
            const svgH = levels.length * (nh + py) + tp + 10;

            const pos = {};
            levels.forEach((lv, li) => {
                const tw = lv.length * nw + (lv.length - 1) * px;
                const sx = (svgW - tw) / 2;
                lv.forEach((sn, ni) => { pos[sn] = { x: sx + ni * (nw + px), y: tp + li * (nh + py) }; });
            });

            const colors = { completed: '#22c55e', failed: '#ef4444', in_progress: '#f59e0b', pending: '#4b5563', blocked: '#475569', waiting_approval: '#a855f7' };
            let svg = '';

            // edges
            steps.forEach(s => {
                if (!s.depends_on) return;
                const to = pos[s.step_number]; if (!to) return;
                s.depends_on.forEach(d => {
                    const from = pos[d]; if (!from) return;
                    const x1 = from.x + nw/2, y1 = from.y + nh;
                    const x2 = to.x + nw/2, y2 = to.y;
                    const my = (y1+y2)/2;
                    svg += `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" fill="none" stroke="rgba(148,163,184,0.35)" stroke-width="1.5" marker-end="url(#ah)"/>`;
                });
            });

            // nodes
            steps.forEach(s => {
                const p = pos[s.step_number]; if (!p) return;
                const c = colors[(s.status || 'pending').toLowerCase()] || '#4b5563';
                svg += `<rect x="${p.x}" y="${p.y}" width="${nw}" height="${nh}" rx="6" fill="rgba(21,24,31,0.95)" stroke="${c}" stroke-width="1.5"/>`;
                svg += `<text x="${p.x+nw/2}" y="${p.y+16}" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600" font-family="Inter,sans-serif">Step ${s.step_number}</text>`;
                svg += `<text x="${p.x+nw/2}" y="${p.y+30}" text-anchor="middle" fill="${c}" font-size="9" font-family="JetBrains Mono,monospace">${s.tool_name}</text>`;
            });

            return `<div class="dag-container"><div class="dag-title">Execution DAG</div><svg width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;"><defs><marker id="ah" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="rgba(148,163,184,0.5)"/></marker></defs>${svg}</svg></div>`;
        }

        async function fetchTraces(workflowId) {
            try {
                const res = await fetch(`/api/agent/traces/${workflowId}`);
                const d = await res.json();
                const el = document.getElementById('traceConsole');
                if (!el) return;
                el.innerHTML = d.traces.map(t => {
                    const time = new Date(t.timestamp).toLocaleTimeString();
                    const detail = t.details ? JSON.stringify(t.details).substring(0, 200) : '';
                    return `<div class="trace-line"><span class="trace-time">[${time}]</span><span class="trace-event">${t.event_type}</span><span>${escHtml(detail)}</span></div>`;
                }).join('');
            } catch (e) {
                console.error('Failed to fetch traces:', e);
            }
        }

        function escHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // Keyboard shortcut: Ctrl+Enter to run
        document.getElementById('goalInput').addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runAgent(); }
        });

        // Init
        checkHealth();
        loadTools();
    </script>
</body>
</html>
